name: Release

# Every push to main publishes a release with the plugin zip and manifest.json, so Jellyfin can install from:
#   https://github.com/<owner>/<repo>/releases/latest/download/manifest.json
#
# Versioning: "version" in .github/plugin.json is the version you set by hand. If no release has it yet,
# that exact version is released. After that each release counts the last number up (1.0.0, 1.0.1, 1.0.2)
# until you set a new version by hand.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/*.jpg', 'docs/banner.png', 'docs/settings.png']
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pick version
        run: |
          BASE=$(jq -r .version .github/plugin.json)
          LATEST=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          LATEST=${LATEST#v}
          if [ -z "$LATEST" ] || [ "$(printf '%s\n%s\n' "$BASE" "$LATEST" | sort -V | tail -n1)" = "$BASE" ] && [ "$BASE" != "$LATEST" ]; then
            VERSION=$BASE
          else
            VERSION="${LATEST%.*}.$(( ${LATEST##*.} + 1 ))"
          fi
          echo "Releasing $VERSION (set by hand: $BASE, last release: ${LATEST:-none})"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION.0" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test JellyBadge.slnx

      - name: Build zip
        run: |
          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ZIP="jellybadge_${VERSION}.zip"
          dotnet publish Jellyfin.Plugin.JellyBadge -c Release -o out -p:Version="$VERSION" -p:AssemblyVersion="$VERSION" -p:FileVersion="$VERSION"
          # meta.json makes the zip work as a standalone install too: unzip into plugins/JellyBadge and restart.
          jq --arg v "$VERSION" --arg ts "$TS" \
            '{guid, name, overview, description, owner, category, targetAbi, version: $v, changelog: "Bug fixes and improvements.", timestamp: $ts, status: "Active", autoUpdate: true, imagePath: "jellybadge.png", assemblies: []}' \
            .github/plugin.json > out/meta.json
          cp docs/jellybadge.png out/
          (cd out && zip "../$ZIP" Jellyfin.Plugin.JellyBadge.dll meta.json jellybadge.png)
          echo "TS=$TS" >> "$GITHUB_ENV"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Build manifest
        run: |
          # Keep the versions of the previous release so older versions stay installable;
          # everything else comes fresh from .github/plugin.json.
          gh release download --repo "$GITHUB_REPOSITORY" --pattern manifest.json --output previous.json \
            || echo '[{"versions": []}]' > previous.json
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP}"
          jq --slurpfile prev previous.json --arg v "$VERSION" --arg ts "$TS" --arg url "$URL" \
             --arg sum "$(md5sum "$ZIP" | cut -d' ' -f1)" \
             '[del(.version) + {versions: ([{version: $v, changelog: "Bug fixes and improvements.", targetAbi: .targetAbi, sourceUrl: $url, checksum: $sum, timestamp: $ts}]
                + [$prev[0][0].versions[] | select(.version != $v)])} | del(.targetAbi)]' \
             .github/plugin.json > manifest.json
          cat manifest.json

      - name: Publish release
        run: |
          gh release create "$TAG" "$ZIP" manifest.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "JellyBadge $TAG" --notes "Bug fixes and improvements."
