name: Release

# Publish a GitHub release with a tag like v1.0.0. This builds the plugin zip and attaches it to the
# release together with manifest.json, so Jellyfin can install from:
#   https://github.com/<owner>/<repo>/releases/latest/download/manifest.json
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test JellyBadge.slnx

      - name: Build zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}.0"
          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ZIP="jellybadge_${VERSION}.zip"
          dotnet publish Jellyfin.Plugin.JellyBadge -c Release -o out -p:Version="$VERSION"
          # meta.json makes the zip work as a standalone install too: unzip into plugins/JellyBadge and restart.
          jq --arg v "$VERSION" --arg ts "$TS" --arg log "$GITHUB_REF_NAME" \
            '{guid, name, overview, description, owner, category, targetAbi, version: $v, changelog: $log, timestamp: $ts, status: "Active", autoUpdate: true, assemblies: []}' \
            .github/plugin.json > out/meta.json
          (cd out && zip "../$ZIP" Jellyfin.Plugin.JellyBadge.dll meta.json)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TS=$TS" >> "$GITHUB_ENV"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Build manifest
        run: |
          # Start from the previous release's manifest so older versions stay installable.
          PREV=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --json tagName --jq "[.[] | select(.tagName != \"$GITHUB_REF_NAME\")][0].tagName")
          { [ -n "$PREV" ] && gh release download "$PREV" --repo "$GITHUB_REPOSITORY" --pattern manifest.json --output previous.json; } \
            || jq '[del(.targetAbi) + {versions: []}]' .github/plugin.json > previous.json
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${ZIP}"
          jq --arg v "$VERSION" --arg ts "$TS" --arg url "$URL" --arg sum "$(md5sum "$ZIP" | cut -d' ' -f1)" \
             --arg abi "$(jq -r .targetAbi .github/plugin.json)" \
             --arg log "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
             '.[0].versions = [{version: $v, changelog: $log, targetAbi: $abi, sourceUrl: $url, checksum: $sum, timestamp: $ts}] + [.[0].versions[] | select(.version != $v)]' \
             previous.json > manifest.json
          cat manifest.json

      - name: Attach to release
        run: gh release upload "$GITHUB_REF_NAME" "$ZIP" manifest.json --repo "$GITHUB_REPOSITORY" --clobber
